[project]
name = "llmops-rag-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yasin", email = "yasinislamhimaloyodesk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "dagshub>=0.7.3",
    "deepeval>=4.3.4",
    "fastapi>=0.162.7",
    "guardrails-ai>=0.11.0",
    "ipykernel>=7.4.0",
    "langchain>=1.5.0",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.0",
    "langchain-openai>=1.8.0",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=5.2.0",
    "langgraph>=1.2.22",
    "python-dotenv>=1.2.4",
]

[project.scripts]
llmops-rag-app = "llmops_rag_app:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
